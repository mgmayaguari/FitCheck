<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FitFindr</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0d0c;
    --fg: #c9f7d0;
    --dim: #5f8f6a;
    --err: #ff8080;
    --accent: #7fffb0;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: ui-monospace, Menlo, Consolas, "Courier New", monospace;
    font-size: 14px;
  }
  body {
    display: flex;
    flex-direction: column;
    max-width: 760px;
    margin: 0 auto;
    padding: 16px;
  }
  header {
    flex: 0 0 auto;
    color: var(--accent);
    padding-bottom: 8px;
    border-bottom: 1px solid #1d2a21;
    margin-bottom: 8px;
  }
  header .hint { color: var(--dim); font-size: 12px; }

  #log {
    flex: 1 1 auto;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-word;
    padding-bottom: 8px;
  }
  .entry { margin-bottom: 14px; }
  .prompt { color: var(--accent); }
  .query { color: var(--fg); }
  .field { color: var(--dim); }
  .error { color: var(--err); }
  .pending { color: var(--dim); }

  form {
    flex: 0 0 auto;
    display: flex;
    gap: 8px;
    border-top: 1px solid #1d2a21;
    padding-top: 8px;
  }
  .prompt-sign { color: var(--accent); padding-top: 8px; }
  input {
    flex: 1 1 auto;
    background: transparent;
    border: none;
    color: var(--fg);
    font: inherit;
    padding: 8px 0;
    outline: none;
  }
  input::placeholder { color: var(--dim); }
  input:disabled { color: var(--dim); }
  button {
    background: transparent;
    border: 1px solid var(--dim);
    color: var(--fg);
    font: inherit;
    padding: 6px 12px;
    cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  button:disabled { color: var(--dim); cursor: default; }
</style>
</head>
<body>
  <header>
    FitFindr
    <div class="hint">type what you're looking for, e.g. "vintage graphic tee under $30" — Enter to ask</div>
  </header>

  <div id="log"></div>

  <form id="form">
    <span class="prompt-sign">&gt;</span>
    <input id="input" type="text" autocomplete="off" placeholder="vintage graphic tee under $30" autofocus>
    <button id="submit" type="submit">Ask</button>
  </form>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");
const submitBtn = document.getElementById("submit");

function appendEntry() {
  const entry = document.createElement("div");
  entry.className = "entry";
  log.appendChild(entry);
  log.scrollTop = log.scrollHeight;
  return entry;
}

function line(parent, text, cls) {
  const div = document.createElement("div");
  if (cls) div.className = cls;
  div.textContent = text;
  parent.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  const query = input.value.trim();
  if (!query) return;

  const entry = appendEntry();
  line(entry, "> " + query, "prompt");
  const pending = document.createElement("div");
  pending.className = "pending";
  pending.textContent = "…thinking";
  entry.appendChild(pending);

  input.value = "";
  input.disabled = true;
  submitBtn.disabled = true;

  try {
    const res = await fetch("/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ query }),
    });
    const body = await res.json().catch(() => ({}));
    pending.remove();

    if (!res.ok || body.error) {
      line(entry, body.error || `HTTP ${res.status}`, "error");
    } else {
      const item = body.selected_item || {};
      line(entry, `Found:  ${item.title} — $${item.price} on ${item.platform}`, "field");
      if (body.relaxed && body.relaxed.length) {
        line(entry, `(dropped: ${body.relaxed.join(", ")})`, "field");
      }
      line(entry, "");
      line(entry, "Outfit: " + body.outfit_suggestion, "field");
      line(entry, "");
      line(entry, "Fit card: " + body.fit_card, "field");
    }
    if (body.request_id) {
      line(entry, `[${body.request_id}]`, "field");
    }
  } catch (err) {
    pending.remove();
    line(entry, "Couldn't reach the server: " + err.message, "error");
  } finally {
    input.disabled = false;
    submitBtn.disabled = false;
    input.focus();
  }
});
</script>
</body>
</html>
